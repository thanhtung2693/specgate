name: cli
on:
  push:
    branches: ["main"]
    paths: ["app/cli/**", ".github/workflows/cli.yml", ".github/scripts/check-legacy-cli.sh"]
  pull_request:
    paths: ["app/cli/**", ".github/workflows/cli.yml", ".github/scripts/check-legacy-cli.sh"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/cli/go.mod
          cache-dependency-path: app/cli/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          package-manager-cache: false
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: make test
      - name: Verify Local store compatibility and recovery
        working-directory: .
        run: bash .github/scripts/check-legacy-cli.sh

  windows-update:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app/cli
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: app/cli/go.mod
          cache-dependency-path: app/cli/go.sum
      - name: Test native Windows CLI boundaries
        run: go test ./internal/command -run 'TestUpdateWindows|TestSelfUpdateWindowsCLI|TestWindowsBrowser|TestOpen|TestLocalUIMaintenanceCacheDeletesOnlyConfirmedOwnedCache|TestTransfer' -count=1
      - name: Test native Windows transfer generations
        run: go test ./internal/local -run 'TestTransferGeneration|TestGenerationStore' -count=1
      - name: Build native Windows CLI
        run: go build -o "${{ runner.temp }}\specgate.exe" ./cmd/specgate
