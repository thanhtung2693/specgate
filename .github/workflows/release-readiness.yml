name: release-readiness
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          package-manager-cache: false
      # Repo-wide release gate: positioning, retired-terminology scan across all
      # tracked files, CLI packaging and shared contract docs.
      # Pure node:test (no dependencies); uses `git ls-files`, so it needs the checkout.
      - run: node --test docs/release-readiness.test.mjs scripts/install-cli.test.mjs scripts/local-review-notifications.test.mjs
