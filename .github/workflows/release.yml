name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Reject pre-published GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          releases="$(gh api --paginate --slurp "repos/${GH_REPO}/releases")"
          if jq -e --arg version "$VERSION" \
            '.[][] | select(.tag_name == $version and .draft == false)' \
            <<<"$releases" >/dev/null; then
            echo "::error::Release ${VERSION} is already public. Push the tag directly and let this workflow publish the draft after verification."
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/cli/go.mod
          cache-dependency-path: app/cli/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Verify CLI
        working-directory: app/cli
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
          make test lint build

      - name: Verify Local store compatibility and recovery
        run: bash .github/scripts/check-legacy-cli.sh

      - name: Verify release-facing contracts
        run: |
          node scripts/build-landing-demo.mjs
          node --test docs/release-readiness.test.mjs .github/scripts/release-notes.test.mjs scripts/install-cli.test.mjs scripts/local-review-notifications.test.mjs app/cli/test/e2e/local-delivery-proof.test.mjs app/landing/landing.test.mjs app/landing/demo/demo.test.mjs
      - run: make check-plugins

  verify-windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/cli/go.mod
          cache-dependency-path: app/cli/go.sum

      - name: Test native Windows CLI boundaries
        working-directory: app/cli
        run: go test ./internal/command -run 'TestUpdateWindows|TestSelfUpdateWindowsCLI|TestWindowsBrowser|TestOpen|TestLocalUIMaintenanceCacheDeletesOnlyConfirmedOwnedCache|TestTransfer' -count=1

      - name: Test native Windows transfer generations
        working-directory: app/cli
        run: go test ./internal/local -run 'TestTransferGeneration|TestGenerationStore' -count=1

      - name: Build native Windows CLI
        working-directory: app/cli
        run: go build -o "${{ runner.temp }}\specgate.exe" ./cmd/specgate

  release-cli:
    needs: [verify, verify-windows-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: app/cli/go.mod
          cache-dependency-path: app/cli/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install GoReleaser
        run: |
          GO_RELEASER_VERSION=v2.18.2
          archive="goreleaser_Linux_x86_64.tar.gz"
          base="https://github.com/goreleaser/goreleaser/releases/download/${GO_RELEASER_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/checksums.txt"
          grep " ${archive}$" checksums.txt | sha256sum -c -
          tar -xzf "${archive}"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Run GoReleaser
        run: |
          node .github/scripts/release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          goreleaser release --clean --release-notes "$RUNNER_TEMP/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}

  release-cli-smoke:
    needs: release-cli
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # GitHub lists draft releases only to tokens with push access.
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ github.ref_name }}
      SPECGATE_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Verify draft CLI assets and run the Local lifecycle
        run: |
          set -euo pipefail
          release_id="$(gh api --paginate --slurp "repos/${GH_REPO}/releases" |
            jq -er --arg version "$VERSION" '
              [.[][] | select(.tag_name == $version and .draft == true)] |
              if length == 1 then .[0].id else error("expected exactly one draft release") end')"
          assets="$(gh api --paginate --slurp "repos/${GH_REPO}/releases/${release_id}/assets")"
          asset_dir="$(mktemp -d "$RUNNER_TEMP/specgate-assets.XXXXXX")"
          cd "$asset_dir"
          download() {
            local name="$1" id
            id="$(jq -er --arg name "$name" '
              [.[][] | select(.name == $name)] |
              if length == 1 then .[0].id else error("expected exactly one matching release asset") end' <<<"$assets")"
            gh api -H "Accept: application/octet-stream" "repos/${GH_REPO}/releases/assets/${id}" > "$name"
          }
          prefix="specgate_${VERSION#v}"
          checksums="${prefix}_checksums.txt"
          linux_archive="${prefix}_linux_amd64.tar.gz"
          download "$checksums"
          download install-cli.sh
          for archive in "$linux_archive" "${prefix}_linux_arm64.tar.gz" "${prefix}_darwin_amd64.tar.gz" "${prefix}_darwin_arm64.tar.gz" "${prefix}_windows_amd64.zip"; do
            download "$archive"
            awk -v asset="$archive" '$2 == asset { print; count++ } END { if (count != 1) exit 1 }' "$checksums" | sha256sum -c -
          done
          cmp install-cli.sh "$GITHUB_WORKSPACE/scripts/install-cli.sh"
          sh install-cli.sh --help
          tar -xzf "$linux_archive" specgate
          install -m 0755 specgate "$asset_dir/installed-specgate"
          "$asset_dir/installed-specgate" --version | grep -Fx "specgate $VERSION"
          demo="$GITHUB_WORKSPACE/app/cli/test/e2e/local-delivery-proof.mjs"
          node "$demo" start "$asset_dir/installed-specgate" --ack-contract | tee start.log
          proof_dir="$(sed -n 's/^Demo directory: //p' start.log)"
          test -n "$proof_dir"
          node "$demo" repair "$proof_dir" | tee repair.log
          grep -F 'Next actor: human_reviewer' repair.log

  release-publish:
    needs: release-cli-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Publish verified draft
        run: |
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$VERSION" --repo "$GH_REPO" --draft=false --prerelease
          else
            gh release edit "$VERSION" --repo "$GH_REPO" --draft=false
          fi
