server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 32m;

  # Gateway-asserted identity (ADR 2026-07-29): the verifier decides who the
  # caller is, and answers 200 with an empty identity while no member has a
  # credential, so an unconfigured deployment stays open.
  auth_request /internal/gateway-auth;
  auth_request_set $specgate_user $upstream_http_x_specgate_user;

  location = /internal/gateway-auth {
    internal;
    proxy_pass http://doc-registry:8080/internal/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-SpecGate-Internal-Agent "";
    proxy_set_header X-SpecGate-User $specgate_user;
    access_log off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    # A probe carries no governance data and must answer an unauthenticated caller.
    auth_request off;
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /api/doc-registry {
    return 308 /api/doc-registry/;
  }

  location /api/doc-registry/ {
    proxy_pass http://doc-registry:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SpecGate-Internal-Agent "";
    proxy_set_header X-SpecGate-User $specgate_user;
    proxy_buffering off;
  }

  # Provider redirect and delivery URLs use Doc Registry's native root paths.
  # Keep the rest of the backend API namespaced under /api/doc-registry/.
  location = /integrations/oauth-callback {
    # A provider redirect cannot present a credential.
    auth_request off;
    proxy_pass http://doc-registry:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SpecGate-Internal-Agent "";
    proxy_set_header X-SpecGate-User $specgate_user;
    proxy_buffering off;
  }

  location ~ ^/integrations/[^/]+/resources/[^/]+/(github|gitlab|linear)/webhook$ {
    # Webhook senders authenticate by payload signature, not by credential.
    auth_request off;
    client_max_body_size 32m;
    proxy_pass http://doc-registry:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-SpecGate-Internal-Agent "";
    proxy_set_header X-SpecGate-User $specgate_user;
    proxy_buffering off;
  }

  location = /api/agents {
    return 308 /api/agents/;
  }

  location /api/agents/ {
    proxy_pass http://agents:8000/;
    proxy_set_header X-SpecGate-Internal-Agent "";
    proxy_set_header X-SpecGate-User $specgate_user;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }

  location ~* \.(?:css|js|mjs|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
